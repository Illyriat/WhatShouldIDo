appId: com.illyriat.whatshouldido
productName: What Should I Do
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - resources/**
  # The Data Collector ESO addon, copied into the player's AddOns folder by
  # src/main/eso/addonInstaller.ts. Comes from the git submodule (see .gitmodules); only
  # the inner addon folder is shipped, not that repo's README/LICENSE/.github.
  - from: vendor/WhatShouldIDoDataCollector/WhatShouldIDoDataCollector
    to: addons/WhatShouldIDoDataCollector
win:
  target: nsis
  icon: resources/icon.png
nsis:
  artifactName: WhatShouldIDo-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  artifactName: WhatShouldIDo-${arch}.${ext}
  icon: resources/icon.png
  category: public.app-category.utilities
linux:
  target:
    - AppImage
    - deb
  artifactName: WhatShouldIDo.${ext}
  icon: resources/icon.png
  category: Utility
publish:
  provider: github
  owner: Illyriat
  repo: WhatShouldIDo
  releaseType: release
