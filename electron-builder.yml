appId: com.illyriat.whatshouldido
productName: What Should I Do
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - resources/**
win:
  target: nsis
  icon: resources/icon.png
nsis:
  # A fixed, space-free name (not ${productName}, which has spaces) - GitHub's
  # releases/latest/download/<name> permalink needs a filename that (a) doesn't
  # change release to release and (b) GitHub won't silently mangle: it doesn't
  # preserve spaces in uploaded asset names, and does so *inconsistently* (some
  # became hyphens, one became dots) - see the README's Download buttons.
  artifactName: WhatShouldIDo-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # dmg is what users install; zip is what electron-updater's MacUpdater actually
  # downloads and applies for in-app auto-update - both are needed. GitHub's macOS
  # runners are Apple Silicon, so this only produces an arm64 build - there's no
  # Intel Mac download until x64 is added to `arch` here (and CI runs on/targets it).
  target:
    - dmg
    - zip
  artifactName: WhatShouldIDo-${arch}.${ext}
  icon: resources/icon.png
  category: public.app-category.utilities
linux:
  # AppImage is what electron-updater's AppImageUpdater supports for in-app
  # auto-update; deb is a convenience download but won't self-update in-app.
  target:
    - AppImage
    - deb
  artifactName: WhatShouldIDo.${ext}
  icon: resources/icon.png
  category: Utility
publish:
  provider: github
  owner: Illyriat
  repo: WhatShouldIDo
  # electron-builder defaults to "draft" (releaseType, not the old "draft: true/false"
  # boolean some docs/issues still reference - that key was removed and rejected by
  # this version's config schema) - draft releases are invisible to users and to
  # electron-updater's auto-update check, so publish immediately as a real release.
  releaseType: release
