name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The Data Collector addon is bundled into the installer from a private repo
          # (a git submodule, see .gitmodules). The default GITHUB_TOKEN can only read this
          # repo, so ADDON_REPO_TOKEN is a fine-grained PAT with read-only Contents access
          # to the addon repo. It expires - renew it if this step starts failing on auth.
          submodules: true
          token: ${{ secrets.ADDON_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify the bundled addon was checked out
        run: npm run check:addon

      - name: Build and publish
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
